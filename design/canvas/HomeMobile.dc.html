<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Segaloka — Beranda HP</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0f1b2d}
a{color:#0a66e0;text-decoration:none}a:hover{color:#0852b8}
</style>
</helmet>
<div style="width: 390px; height: 1760px; box-sizing: border-box; background: #f3f6fb; display: flex; flex-direction: column; position: relative">

  <div style="background: #0a66e0; color: #ffffff; padding: 20px 16px 88px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 34px; height: 34px; border-radius: 10px; background: #ffffff; color: #0a66e0; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px">S</span>
      <span style="font-size: 20px; font-weight: 800; letter-spacing: -0.02em">Segaloka</span>
      <button type="button" aria-label="Ganti bahasa" style="margin-left: auto; height: 44px; padding: 0 10px; border: 0; border-radius: 10px; background: #1f78ea; color: #ffffff; font: inherit; font-weight: 700; font-size: 14px">ID</button>
      <button type="button" aria-label="Notifikasi" style="width: 44px; height: 44px; border: 0; border-radius: 10px; background: #1f78ea; color: #ffffff; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></button>
    </div>
    <div style="font-size: 24px; font-weight: 800; line-height: 1.25; letter-spacing: -0.01em">Assalamu’alaikum, Zautour</div>
  </div>

  <div style="margin: -70px 16px 0; background: #ffffff; border-radius: 20px; box-shadow: 0 20px 40px -20px rgba(15,40,80,.35); padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 6px; overflow: hidden">
      <span style="padding: 9px 14px; border-radius: 999px; background: #0a66e0; color: #ffffff; font-size: 14px; font-weight: 700">Umrah</span>
      <span style="padding: 9px 14px; border-radius: 999px; background: #eef1f6; font-size: 14px; font-weight: 600">Haji</span>
      <span style="padding: 9px 14px; border-radius: 999px; background: #eef1f6; font-size: 14px; font-weight: 600">Halal Tour</span>
      <span style="padding: 9px 14px; border-radius: 999px; background: #eef1f6; font-size: 14px; font-weight: 600">Tour</span>
    </div>
    <label for="m1" style="height: 56px; border: 1.5px solid #c9d3e2; border-radius: 14px; display: flex; align-items: center; gap: 10px; padding: 0 14px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0a66e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
      <span style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #4a5870; font-weight: 600">Berangkat dari</span><input id="m1" value="Makassar" style="border: 0; outline: 0; padding: 0; font: inherit; font-size: 15px; font-weight: 700; background: transparent"></span>
    </label>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <label for="m2" style="height: 56px; border: 1.5px solid #c9d3e2; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; padding: 0 14px"><span style="font-size: 12px; color: #4a5870; font-weight: 600">Bulan</span><input id="m2" value="Des 2026" style="border: 0; outline: 0; padding: 0; font: inherit; font-size: 15px; font-weight: 700; background: transparent"></label>
      <label for="m3" style="height: 56px; border: 1.5px solid #c9d3e2; border-radius: 14px; display: flex; flex-direction: column; justify-content: center; padding: 0 14px"><span style="font-size: 12px; color: #4a5870; font-weight: 600">Jamaah</span><input id="m3" value="2 orang" style="border: 0; outline: 0; padding: 0; font: inherit; font-size: 15px; font-weight: 700; background: transparent"></label>
    </div>
    <button type="button" style="height: 52px; border: 0; border-radius: 14px; background: #ff9f1c; color: #241400; font: inherit; font-weight: 800; font-size: 16px">Cari Paket</button>
  </div>

  <div style="padding: 20px 16px 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{shortcuts}}" as="s" hint-placeholder-count="4">
      <a href="#" style="display: flex; flex-direction: column; align-items: center; gap: 8px; color: #0f1b2d; font-size: 12px; font-weight: 700; text-align: center">
        <span style="width: 56px; height: 56px; border-radius: 16px; background: {{s.bg}}; color: {{s.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800">{{s.short}}</span>{{s.label}}</a>
    </sc-for>
  </div>

  <div style="margin: 20px 16px 0; background: #0b1f3f; border-radius: 18px; padding: 18px; color: #ffffff; display: flex; flex-direction: column; gap: 10px">
    <span style="padding: 4px 10px; border-radius: 999px; background: #ff9f1c; color: #241400; font-size: 12px; font-weight: 800; width: max-content">SegaDeals</span>
    <div style="font-size: 18px; font-weight: 800; line-height: 1.3">Biar Travel yang menawar untuk Anda</div>
    <a href="#" style="height: 44px; border-radius: 12px; background: #ffffff; color: #0b1f3f; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center">Ajukan kebutuhan</a>
  </div>

  <div style="padding: 24px 16px 0; display: flex; align-items: center; justify-content: space-between"><h2 style="margin: 0; font-size: 20px; font-weight: 800">Paket Terbaru</h2><a href="#" style="font-weight: 700; font-size: 14px">Lihat semua</a></div>

  <div style="padding: 12px 16px 120px; display: flex; flex-direction: column; gap: 14px">
    <sc-for list="{{packages}}" as="p" hint-placeholder-count="3">
      <a href="#" style="background: #ffffff; border: 1px solid #e1e7f0; border-radius: 18px; overflow: hidden; color: #0f1b2d; display: flex">
        <div style="width: 118px; flex-shrink: 0; background: #dbe7f8; display: flex; align-items: center; justify-content: center; color: #4a5870; font-size: 11px; font-weight: 600">[Foto]</div>
        <div style="padding: 12px 14px; display: flex; flex-direction: column; gap: 5px; flex-grow: 1">
          <span style="font-size: 11px; font-weight: 800; color: #0852b8">{{p.type}}</span>
          <div style="font-size: 15px; font-weight: 700; line-height: 1.3">{{p.name}}</div>
          <div style="font-size: 12px; color: #4a5870">{{p.meta}}</div>
          <div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 11px; font-weight: 700; color: #a42424">{{p.seats}}</span><span style="font-size: 17px; font-weight: 800; color: #e25d00">{{p.price}}</span></div>
        </div>
      </a>
    </sc-for>
  </div>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #ffffff; border-top: 1px solid #e1e7f0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); padding-bottom: 8px">
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #0a66e0; font-size: 11px; font-weight: 800"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Beranda</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4a5870; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>Jelajah</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4a5870; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"></path><circle cx="7.5" cy="7.5" r="1"></circle></svg>SegaDeals</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4a5870; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"></rect><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"></path></svg>Booking</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #4a5870; font-size: 11px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>Akun</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1760}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      shortcuts: [
        { short: 'UM', label: 'Umrah', bg: '#e6f0fd', fg: '#0852b8' },
        { short: 'HJ', label: 'Haji', bg: '#e4f3e4', fg: '#0a6b0a' },
        { short: 'HT', label: 'Halal Tour', bg: '#fff1dc', fg: '#8a4a00' },
        { short: 'TR', label: 'Tour', bg: '#efe8fb', fg: '#5b36a8' }
      ],
      packages: [
        { type: 'UMRAH', name: 'Umrah Reguler 9 Hari', meta: '12 Des · Dari Makassar', seats: 'Sisa 6 kursi', price: 'Rp 32,5 jt' },
        { type: 'UMRAH', name: 'Umrah Plus Turki 12 Hari', meta: '5 Jan · Dari Surabaya', seats: 'Sisa 12 kursi', price: 'Rp 41,9 jt' },
        { type: 'HALAL TOUR', name: 'Halal Tour Jepang 7 Hari', meta: '3 Mar · Dari Makassar', seats: 'Sisa 9 kursi', price: 'Rp 24,8 jt' },
        { type: 'HAJI', name: 'Haji Khusus 25 Hari', meta: 'Mei · Dari Jakarta', seats: 'Kuota terbatas', price: 'US$ 13.500' }
      ]
    };
  }
}
</script>
</body>
</html>
