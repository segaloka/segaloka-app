<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Control Center — Moderasi Paket</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0f1b2d}
a{color:#0a66e0;text-decoration:none}a:hover{color:#0852b8}
</style>
</helmet>
<div style="width: 1440px; height: 1080px; box-sizing: border-box; background: #f3f6fb; display: flex">
  <div style="width: 264px; flex-shrink: 0; background: #0b1f3f"><dc-import name="AdminSidebar" active="mp_mod" hint-size="264px,1080px"></dc-import></div>
  <main style="flex-grow: 1; display: flex; flex-direction: column; min-width: 0">
    <dc-import name="AdminTopbar" hint-size="1176px,72px"></dc-import>
    <div style="padding: 24px 32px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; align-items: flex-end; justify-content: space-between">
        <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; font-weight: 800">Moderasi Paket</h1><div style="font-size: 14px; color: #4a5870">Paket yang ditandai sistem atau dilaporkan jamaah. Paket tetap tayang sampai admin memutuskan, kecuali ditandai “berisiko tinggi”.</div></div>
        <div style="display: flex; gap: 6px"><span style="padding: 8px 14px; border-radius: 999px; background: #0f1b2d; color: #ffffff; font-size: 13px; font-weight: 700">Perlu tinjauan · 5</span><span style="padding: 8px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e1e7f0; font-size: 13px; font-weight: 600">Laporan jamaah · 2</span><span style="padding: 8px 14px; border-radius: 999px; background: #ffffff; border: 1px solid #e1e7f0; font-size: 13px; font-weight: 600">Diturunkan</span></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <sc-for list="{{items}}" as="p" hint-placeholder-count="4">
          <div style="background: #ffffff; border: 1px solid #e1e7f0; border-radius: 18px; padding: 16px; display: flex; gap: 14px">
            <div style="width: 120px; height: 120px; flex-shrink: 0; border-radius: 12px; background: #dbe7f8; color: #4a5870; font-size: 12px; font-weight: 600; display: flex; align-items: center; justify-content: center">[Foto]</div>
            <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 12px; font-weight: 800; color: #0852b8">{{p.travel}}</span><span style="padding: 3px 10px; border-radius: 999px; background: {{p.rbg}}; color: {{p.rfg}}; font-size: 12px; font-weight: 800">{{p.risk}}</span></div>
              <span style="font-size: 16px; font-weight: 800">{{p.name}}</span>
              <span style="font-size: 13px; color: #4a5870">{{p.meta}}</span>
              <div style="background: #fff8ec; border-radius: 10px; padding: 8px 10px; font-size: 13px; color: #6b3a00; line-height: 1.4"><b>Alasan:</b> {{p.reason}}</div>
              <div style="display: flex; gap: 8px; padding-top: 4px"><button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: #0a66e0; color: #ffffff; font: inherit; font-weight: 700; font-size: 13px">Tetap tayang</button><button type="button" style="height: 38px; padding: 0 14px; border: 1.5px solid #c9d3e2; border-radius: 10px; background: #ffffff; font: inherit; font-weight: 700; font-size: 13px">Minta perbaikan</button><button type="button" style="height: 38px; padding: 0 14px; border: 0; border-radius: 10px; background: #fbe7e7; color: #a42424; font: inherit; font-weight: 700; font-size: 13px">Turunkan</button></div>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="background: #ffffff; border: 1px solid #e1e7f0; border-radius: 18px; padding: 16px 20px; display: flex; gap: 24px; align-items: center">
        <span style="font-size: 15px; font-weight: 800">Aturan otomatis</span>
        <sc-for list="{{rules}}" as="r" hint-placeholder-count="4"><label style="display: flex; align-items: center; gap: 8px; font-size: 13px"><input type="checkbox" checked="{{r.on}}" style="width: 18px; height: 18px; accent-color: #0a66e0; margin: 0">{{r.label}}</label></sc-for>
        <a href="AdminSettings.dc.html" style="margin-left: auto; font-size: 13px; font-weight: 700">Atur ambang</a>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var hi = ['Risiko tinggi', '#fbe7e7', '#a42424'], md = ['Sedang', '#fdf0da', '#8a5300'], lo = ['Rendah', '#eef1f6', '#4a5870'];
    var p = function (travel, name, meta, reason, r) { return { travel: travel, name: name, meta: meta, reason: reason, risk: r[0], rbg: r[1], rfg: r[2] }; };
    return {
      items: [
        p('[Travel G]', 'Umrah Super Hemat 9 Hari', 'Rp 14,9 jt · 20 Des 2026 · 45 kursi', 'Harga 54% di bawah rata-rata pasar untuk durasi & bulan yang sama.', hi),
        p('[Travel B]', 'Umrah Plus Turki 12 Hari', 'Rp 41,9 jt · 5 Jan 2027', 'Dilaporkan jamaah: hotel di deskripsi berbeda dengan yang diinfokan.', md),
        p('[Travel D]', 'Halal Tour Korea 8 Hari', 'Rp 22,5 jt · 12 Feb 2027', 'Foto utama terdeteksi memuat nomor telepon & ajakan transaksi di luar Segaloka.', hi),
        p('[Travel C]', 'Haji Furoda 2027', 'US$ 21.000 · Mei 2027', 'Program Haji memerlukan izin PIHK — Travel belum mengunggah izin.', hi),
        p('[Travel A]', 'Umrah Ramadhan 15 Hari', 'Rp 48,0 jt · Mar 2027', 'Itinerary kosong di hari 6–10.', lo),
        p('[Travel E]', 'Umrah Reguler 9 Hari', 'Rp 29,5 jt · Jan 2027', 'Kuota kursi (80) melebihi kapasitas pesawat grup yang dicantumkan.', md)
      ],
      rules: [{ label: 'Harga < 60% rata-rata pasar', on: true }, { label: 'Nomor telepon / link di foto & deskripsi', on: true }, { label: 'Paket Haji tanpa izin PIHK', on: true }, { label: 'Itinerary tidak lengkap', on: false }]
    };
  }
}
</script>
</body>
</html>
