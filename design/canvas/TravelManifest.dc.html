<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Travel — Manifest</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0f1b2d}
a{color:#0a66e0;text-decoration:none}a:hover{color:#0852b8}
</style>
</helmet>
<div style="width: 1440px; height: 1080px; box-sizing: border-box; background: #f3f6fb; display: flex">
  <dc-import name="TravelSidebar" active="manifest" hint-size="264px,1080px"></dc-import>
  <main style="flex-grow: 1; padding: 24px 32px; display: flex; flex-direction: column; gap: 16px; min-width: 0">
    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 26px; font-weight: 800">Manifest</h1><div style="font-size: 14px; color: #4a5870">Daftar jamaah per keberangkatan dan kelengkapan dokumennya.</div></div>
      <div style="display: flex; gap: 8px"><button type="button" style="height: 44px; padding: 0 14px; border: 1.5px solid #c9d3e2; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 700">Ekspor Excel</button><button type="button" style="height: 44px; padding: 0 14px; border: 1.5px solid #c9d3e2; border-radius: 12px; background: #ffffff; font: inherit; font-weight: 700">Kirim ke Vendor Visa</button><button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: #0a66e0; color: #ffffff; font: inherit; font-weight: 800">Minta dokumen yang kurang</button></div>
    </div>
    <div style="display: flex; gap: 10px">
      <sc-for list="{{deps}}" as="d" hint-placeholder-count="3"><div style="padding: 12px 16px; border-radius: 14px; background: {{d.bg}}; border: {{d.b}}; display: flex; flex-direction: column; gap: 2px; min-width: 220px"><span style="font-size: 14px; font-weight: 800">{{d.t}}</span><span style="font-size: 12px; color: #4a5870">{{d.m}}</span></div></sc-for>
    </div>
    <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{docs}}" as="k" hint-placeholder-count="4"><div style="background: #ffffff; border: 1px solid #e1e7f0; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px"><div style="display: flex; justify-content: space-between; font-size: 13px"><span style="font-weight: 700">{{k.l}}</span><span style="font-weight: 800">{{k.v}}</span></div><div style="height: 8px; border-radius: 999px; background: #eef1f6"><div style="height: 8px; width: {{k.w}}; border-radius: 999px; background: {{k.c}}"></div></div></div></sc-for>
    </div>
    <div style="background: #ffffff; border: 1px solid #e1e7f0; border-radius: 18px; overflow: hidden">
      <div style="display: grid; grid-template-columns: 44px 2fr 0.7fr 1.1fr 1fr 0.8fr 0.8fr 0.8fr 0.8fr; padding: 11px 18px; background: #f7f9fc; border-bottom: 1px solid #e1e7f0; font-size: 12px; font-weight: 800; letter-spacing: .05em; color: #4a5870"><span>#</span><span>NAMA (SESUAI PASPOR)</span><span>L/P</span><span>NO. PASPOR</span><span>SUMBER</span><span>PASPOR</span><span>VISA</span><span>VAKSIN</span><span>BAYAR</span></div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
        <div style="display: grid; grid-template-columns: 44px 2fr 0.7fr 1.1fr 1fr 0.8fr 0.8fr 0.8fr 0.8fr; align-items: center; padding: 10px 18px; border-bottom: 1px solid #eef1f6; font-size: 13px">
          <span style="color: #4a5870">{{r.n}}</span><span style="font-weight: 800">{{r.name}}</span><span>{{r.g}}</span><span style="color: #4a5870">{{r.p}}</span><span style="color: #4a5870">{{r.src}}</span>
          <span style="font-weight: 800; color: {{r.pc}}">{{r.ps}}</span><span style="font-weight: 800; color: {{r.vc}}">{{r.vs}}</span><span style="font-weight: 800; color: {{r.mc}}">{{r.ms}}</span><span style="font-weight: 800; color: {{r.bc}}">{{r.bs}}</span>
        </div>
      </sc-for>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    var ok = '#0a6b0a', w = '#8a5300', no = '#a42424';
    var st = function (s) { return s === 1 ? ['✓', ok] : s === 0 ? ['Kurang', no] : ['Proses', w]; };
    var r = function (n, name, g, p, src, a, b, c, d) { var A = st(a), B = st(b), C = st(c), D = d === 1 ? ['Lunas', ok] : ['DP', w]; return { n: n, name: name, g: g, p: p, src: src, ps: A[0], pc: A[1], vs: B[0], vc: B[1], ms: C[0], mc: C[1], bs: D[0], bc: D[1] }; };
    return {
      deps: [{ t: '12 Des · Umrah Reguler 9H', m: '39/45 jamaah', bg: '#e6f0fd', b: '2px solid #0a66e0' }, { t: '20 Des · Umrah Akhir Tahun', m: '28/40 jamaah', bg: '#ffffff', b: '1px solid #e1e7f0' }, { t: '5 Jan · Umrah Plus Turki', m: '12/40 jamaah', bg: '#ffffff', b: '1px solid #e1e7f0' }],
      docs: [{ l: 'Paspor', v: '36/39', w: '92%', c: '#0ca30c' }, { l: 'Visa', v: '30/39', w: '77%', c: '#0a66e0' }, { l: 'Vaksin meningitis', v: '27/39', w: '69%', c: '#ff9f1c' }, { l: 'Pelunasan', v: '31/39', w: '79%', c: '#0a66e0' }],
      rows: [
        r(1, 'SITI AMINAH', 'P', 'C12•••67', 'Agen Sinjai', 1, 2, 0, 0),
        r(2, 'ABDUL RAHMAN', 'L', 'C45•••12', 'Website', 1, 1, 1, 1),
        r(3, 'NURHAYATI', 'P', 'B98•••04', 'Affiliate Nur', 1, 1, 1, 1),
        r(4, 'MUHAMMAD YUSUF', 'L', 'C33•••90', 'Kantor pusat', 1, 1, 2, 1),
        r(5, 'HJ. ST. RAHMAH', 'P', '—', 'Mitra Bone', 0, 0, 0, 0),
        r(6, 'ANDI BAHAR', 'L', 'C71•••55', 'Agen Pare', 1, 2, 1, 1),
        r(7, 'FAUZIAH', 'P', 'C09•••33', 'Website', 1, 1, 1, 1),
        r(8, 'IRFAN HIDAYAT', 'L', 'C62•••18', 'SegaDeals', 1, 1, 1, 1),
        r(9, 'RAHMAWATI', 'P', 'C28•••71', 'Affiliate Nur', 1, 2, 0, 0),
        r(10, 'H. BAHARUDDIN', 'L', 'B11•••46', 'Agen Sinjai', 1, 1, 1, 1)
      ]
    };
  }
}
</script>
</body>
</html>
